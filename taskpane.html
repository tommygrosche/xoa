<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xOrg Outlook Acceleration</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body class="pane">

  <main id="viewMain">
    <section class="context">
      <div class="context-label">Betreff (bereinigt)</div>
      <div id="normSubject" class="context-subject">–</div>
      <details class="raw">
        <summary>Originalbetreff und Präfixe</summary>
        <p class="hint">Text markieren und als Präfix übernehmen, z. B. „[EXTERN]“.</p>
        <div id="rawSubject" class="raw-subject selectable">–</div>
        <button type="button" id="btnAddSelection" class="btn btn-secondary btn-small">Markierung als Präfix hinzufügen</button>
        <div id="selectionHint" class="hint muted"></div>
      </details>
    </section>

    <section class="results">
      <div class="results-head">
        <h2>Verwandte Mails</h2>
        <span id="resultCount" class="count"></span>
      </div>
      <form id="termForm" class="term-form" autocomplete="off">
        <input id="terms" type="search" placeholder="Weitere Begriffe im Betreff, z. B. Projekt 1; Kunde 1" aria-label="Weitere Suchbegriffe im Betreff, getrennt durch Semikolon" spellcheck="false">
        <button type="submit" class="btn btn-secondary btn-small">Suchen</button>
      </form>
      <div id="state" class="state" role="status" aria-live="polite"></div>
      <div id="windowBox" class="window-box" hidden>
        <button type="button" id="btnOpenWindow" class="btn btn-primary">In Fenster anzeigen</button>
        <p id="windowHint" class="hint muted">Öffnet ein eigenes Fenster für dieses Thema. Es bleibt offen, egal was du in Outlook machst.</p>
      </div>
      <div id="list" class="list" role="list"></div>
      <div id="meta" class="meta"></div>
    </section>
  </main>

  <section id="viewSettings" class="settings" hidden>
    <h2>Einstellungen</h2>

    <label for="cfgUrl">xob-mail URL (HTTP-URL des Flows)</label>
    <input id="cfgUrl" type="url" autocomplete="off" spellcheck="false" placeholder="https://prod-00.westeurope.logic.azure.com/…">
    <div class="field-error" id="errUrl"></div>

    <label for="cfgKey">xob-Schlüssel</label>
    <div class="row-inline">
      <input id="cfgKey" type="password" autocomplete="off" spellcheck="false">
      <button type="button" id="btnShowKey" class="btn btn-secondary btn-small">Anzeigen</button>
    </div>
    <div class="field-error" id="errKey"></div>

    <div class="grid2">
      <div>
        <label for="cfgMax">Max. Treffer</label>
        <input id="cfgMax" type="number" min="1" max="100" step="1">
        <div class="field-error" id="errMax"></div>
      </div>
      <div>
        <label for="cfgMin">Min. Zeichen Betreff</label>
        <input id="cfgMin" type="number" min="1" max="50" step="1">
        <div class="field-error" id="errMin"></div>
      </div>
    </div>

    <label for="cfgMode">Betreff-Suche</label>
    <select id="cfgMode">
      <option value="subject">Nur im Betreff (empfohlen)</option>
      <option value="all">Betreff, Text und Absender</option>
    </select>

    <label>Ignorierte Präfixe</label>
    <div id="prefixList" class="chips"></div>
    <div class="row-inline">
      <input id="cfgNewPrefix" type="text" placeholder="[EXTERNAL]" spellcheck="false">
      <button type="button" id="btnAddPrefix" class="btn btn-secondary btn-small">Hinzufügen</button>
    </div>
    <div class="field-error" id="errPrefix"></div>

    <div class="actions">
      <button type="button" id="btnSave" class="btn btn-primary">Speichern</button>
      <button type="button" id="btnTest" class="btn btn-secondary">Verbindung testen</button>
      <button type="button" id="btnClose" class="btn btn-ghost">Zurück</button>
    </div>
    <div id="settingsStatus" class="hint" role="status" aria-live="polite"></div>
    <p class="hint muted" id="versionInfo"></p>
  </section>

  <footer class="app-footer">
    <picture class="app-logo">
      <source srcset="logo-dark.png" media="(prefers-color-scheme: dark)">
      <img src="logo.png" alt="xOrg" width="46" height="16">
    </picture>
    <span class="app-title">Outlook Acceleration</span>
    <span class="app-version" id="appVersion"></span>
    <button type="button" id="btnRefresh" class="icon-btn" aria-label="Aktualisieren" title="Aktualisieren">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6M16.5 3.5v3.5H13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" id="btnSettings" class="icon-btn" aria-label="Einstellungen" title="Einstellungen">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="core.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
