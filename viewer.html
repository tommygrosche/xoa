<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Related emails</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="win-header">
    <span class="win-logo"><img src="logo.png" alt="xOrg"></span>
    <div class="win-title">
      <span class="win-label"><span id="kind" class="win-kind">Related emails</span> · <span id="opened"></span></span>
      <span id="subject" class="win-subject">–</span>
      <span id="terms" class="win-terms"></span>
    </div>
    <input id="filter" type="search" placeholder="Search all" title="Free text search across all columns and the email text" aria-label="Search all columns" spellcheck="false">
    <span id="count" class="win-count"></span>
    <button type="button" id="btnRefresh" class="icon-btn" aria-label="Refresh" title="Refresh">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6M16.5 3.5v3.5H13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <div class="table-wrap" id="wrap">
    <table id="grid" aria-label="Related emails">
      <colgroup id="cols"></colgroup>
      <thead>
        <tr id="heads"></tr>
        <tr id="filters" class="filters"></tr>
      </thead>
    </table>
    <div id="state" class="state" role="status" aria-live="polite">Loading…</div>
  </div>

  <footer class="win-footer">
    <span>Double-click an email to open it. Click a column title to sort, drag its right edge to resize.</span>
    <span id="meta"></span>
  </footer>

  <script src="core.js"></script>
  <script src="viewer-host.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
