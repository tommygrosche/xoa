<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xOrg – Verwandte Mails</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="win-header">
    <picture class="win-logo">
      <source srcset="logo-dark.png" media="(prefers-color-scheme: dark)">
      <img src="logo.png" alt="xOrg" width="58" height="20">
    </picture>
    <div class="win-title">
      <span class="win-label">Verwandte Mails · <span id="opened"></span></span>
      <span id="subject" class="win-subject">–</span>
    </div>
    <input id="filter" type="search" placeholder="Filtern" aria-label="Liste filtern" spellcheck="false">
    <span id="count" class="win-count"></span>
    <button type="button" id="btnRefresh" class="icon-btn" aria-label="Aktualisieren" title="Aktualisieren">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6M16.5 3.5v3.5H13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <div class="table-wrap">
    <table id="grid" aria-label="Verwandte Mails">
      <colgroup>
        <col class="c-from"><col class="c-to"><col class="c-subject"><col class="c-received"><col class="c-icon"><col class="c-icon">
      </colgroup>
      <thead>
        <tr>
          <th data-key="from" scope="col"><button type="button">From</button></th>
          <th data-key="to" scope="col"><button type="button">To</button></th>
          <th data-key="subject" scope="col"><button type="button">Subject</button></th>
          <th data-key="received" scope="col" aria-sort="descending"><button type="button">Received</button></th>
          <th data-key="hasAttachments" scope="col" class="ic" title="Anhang"><button type="button" aria-label="Anhang">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 4.5 5.8 9.2a1.4 1.4 0 0 0 2 2l5-5a2.8 2.8 0 0 0-4-4l-5.2 5.2a4.2 4.2 0 0 0 6 6l4.2-4.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button></th>
          <th data-key="flag" scope="col" class="ic" title="Kennzeichnung"><button type="button" aria-label="Kennzeichnung">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 14.5V2.5m0 0h8l-1.8 3 1.8 3h-8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="state" class="state" role="status" aria-live="polite">Lädt…</div>
  </div>

  <footer class="win-footer">
    <span>Doppelklick öffnet die Mail in Outlook im Web.</span>
    <span id="meta"></span>
  </footer>

  <script src="core.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
